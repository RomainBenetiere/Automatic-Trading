services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-backend
    ports:
      # Bound to localhost only: the dashboard reaches the API through nginx (/api).
      # The job-trigger endpoints have no auth, so don't expose them on the LAN.
      # For Swagger docs from another machine, use an SSH tunnel:
      #   ssh -L 8000:localhost:8000 root@<lxc-ip>  → http://localhost:8000/docs
      - "127.0.0.1:8000:8000"
    volumes:
      - trading-data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/health'); r.raise_for_status()"]
      interval: 60s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  trading-data:
    driver: local
